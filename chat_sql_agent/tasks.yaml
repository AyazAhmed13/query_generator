fetch_schema:
  description: >
    Extract columns and data types from the selected SQLite table.
  expected_output: >
    A formatted schema including:
    - Columns and data types for the selected table

generate_sql:
  description: >
    Given a user question and the schema, produce a SQL query that can answer the user's question.
  expected_output: >
    A single SQL query (no explanation or extra output)
